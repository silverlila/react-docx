name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# npm trusted publishing: npm trusts this workflow file, so no token is stored.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Ensure dist folder exists
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist folder not found!"
            exit 1
          fi

      - name: Publish
        run: npm publish

      # npm logs why the trusted-publishing login failed only to its debug log.
      - name: Show npm's trusted-publishing log
        if: failure()
        run: grep -h oidc ~/.npm/_logs/*-debug-0.log
